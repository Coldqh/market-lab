name: Check MARKET / LAB core
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
