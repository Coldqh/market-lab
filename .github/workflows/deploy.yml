name: Deploy MARKET / LAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish static site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Verify application logic
        run: npm run check

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Verify real browser flow
        run: npm run smoke

      - name: Prepare website
        run: |
          mkdir -p dist
          cp index.html styles.css app.js favicon.svg dist/
          mkdir -p dist/core
          cp core/finance.mjs core/risk.mjs core/market.mjs core/learning.mjs core/labs.mjs dist/core/
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
